[target.x86_64-unknown-none]
# By default this target produces a static-PIE, but nothing applies its relocations at startup
# (there is no dynamic loader and no self-relocation code), which breaks vtables and any other
# pointer stored in static data. Link a non-relocatable executable instead.
rustflags = ["-C", "relocation-model=static"]
