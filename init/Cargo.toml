[package]
name = "init"
version = "0.1.0"
edition = "2024"
resolver = "3"

[workspace]

[dependencies]
allocator-api2 = { version = "0.4.0", default-features = false }
arrayvec = { version = "0.7.8", default-features = false }
atomicbox = { version = "0.4.0" }
cranelift-codegen = { version = "0.135.5", default-features = false, features = ["std", "x86"] }
cranelift-frontend = { version = "0.135.5", default-features = false, features = ["std"] }
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }
fnv = { version = "1.0.7", default-features = false }
hashbrown = { version = "0.17.1", default-features = false }
imbl = { version = "7.0.2", default-features = false }
interface-bindings = { path = "../interface-bindings" }
io-uring = { version = "0.7.16" }
syscalls = { version = "0.8.1", default-features = false }
target-lexicon = { version = "0.13.5", default-features = false }
wasmparser = { version = "0.249.0", default-features = false, features = ["std", "validate", "features"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets"] }
