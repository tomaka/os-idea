[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
cpio = "0.4.1"
fatfs = "0.3.6"
flate2 = "1.0"
fscommon = "0.1.1"
futures-util = "0.3.32"
gpt = "4.0"
indicatif = "0.18"
interface-bindings = { path = "../interface-bindings" }
rand = "0.10.3"
tar = "0.4.45"
tempfile = "3"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
uuid = "1"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets"] }
